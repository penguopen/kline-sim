<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PENGU K線 — 市場模擬器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0f;
    color: #e0e0e0;
    font-family: 'Courier New', monospace;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  #title {
    font-size: 1.4rem;
    letter-spacing: 4px;
    color: #ffd700;
    margin-bottom: 8px;
    text-shadow: 0 0 20px rgba(255,215,0,0.6);
  }

  #price-display {
    font-size: 3.5rem;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 4px;
    transition: color 0.2s, text-shadow 0.2s;
  }

  #price-display.up {
    color: #00ff88;
    text-shadow: 0 0 30px rgba(0,255,136,0.8), 0 0 60px rgba(0,255,136,0.4);
  }

  #price-display.down {
    color: #ff3355;
    text-shadow: 0 0 30px rgba(255,51,85,0.8), 0 0 60px rgba(255,51,85,0.4);
  }

  #change-display {
    font-size: 1.2rem;
    margin-bottom: 16px;
    letter-spacing: 2px;
  }

  #change-display.up { color: #00ff88; }
  #change-display.down { color: #ff3355; }

  #chart-container {
    position: relative;
    width: 860px;
    height: 420px;
    border: 1px solid #1e1e2e;
    background: #0d0d18;
    border-radius: 4px;
    overflow: hidden;
  }

  canvas { display: block; }

  #grid-overlay {
    position: absolute;
    top: 0; left: 0;
    pointer-events: none;
    opacity: 0.06;
  }

  /* MA lines legend */
  #legend {
    display: flex;
    gap: 20px;
    margin-bottom: 8px;
    font-size: 0.78rem;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot { width: 20px; height: 2px; border-radius: 1px; }

  #volume-bar {
    width: 860px;
    height: 50px;
    display: flex;
    align-items: flex-end;
    gap: 1px;
    margin-top: 4px;
  }
  .vol-bar {
    flex: 1;
    border-radius: 1px 1px 0 0;
    min-height: 2px;
    transition: height 0.3s;
  }

  #buttons {
    display: flex;
    gap: 20px;
    margin-top: 20px;
  }

  .btn {
    padding: 14px 36px;
    font-size: 1.2rem;
    font-family: 'Courier New', monospace;
    font-weight: bold;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 3px;
    transition: transform 0.1s, box-shadow 0.1s;
    position: relative;
    overflow: hidden;
  }

  .btn:active { transform: scale(0.95); }

  .btn-moon {
    background: linear-gradient(135deg, #ff6b00, #ffd700);
    color: #1a0a00;
    box-shadow: 0 0 20px rgba(255,180,0,0.4);
  }
  .btn-moon:hover {
    box-shadow: 0 0 40px rgba(255,180,0,0.7);
  }

  .btn-crash {
    background: linear-gradient(135deg, #ff0033, #ff5555);
    color: #fff;
    box-shadow: 0 0 20px rgba(255,0,51,0.4);
  }
  .btn-crash:hover {
    box-shadow: 0 0 40px rgba(255,0,51,0.7);
  }

  .btn-reset {
    background: #1e1e2e;
    color: #888;
    border: 1px solid #333;
    box-shadow: none;
  }

  /* Flash overlay effects */
  #flash-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    opacity: 0;
    z-index: 100;
    transition: opacity 0.05s;
  }

  #flash-overlay.moon {
    background: radial-gradient(ellipse at center, rgba(255,200,0,0.25) 0%, transparent 70%);
    animation: flash-moon 0.6s ease-out;
  }

  #flash-overlay.crash {
    background: radial-gradient(ellipse at center, rgba(255,0,50,0.35) 0%, transparent 70%);
    animation: flash-crash 0.8s ease-out;
  }

  @keyframes flash-moon {
    0% { opacity: 1; }
    100% { opacity: 0; }
  }

  @keyframes flash-crash {
    0% { opacity: 1; }
    30% { opacity: 0.8; }
    100% { opacity: 0; }
  }

  /* Shake animation */
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    15% { transform: translateX(-12px) rotate(-0.5deg); }
    30% { transform: translateX(12px) rotate(0.5deg); }
    45% { transform: translateX(-8px) rotate(-0.3deg); }
    60% { transform: translateX(8px) rotate(0.3deg); }
    75% { transform: translateX(-4px); }
    90% { transform: translateX(4px); }
  }

  body.shaking {
    animation: shake 0.7s ease-out;
  }

  /* Particles canvas */
  #particles {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 99;
  }

  #status-bar {
    margin-top: 12px;
    font-size: 0.75rem;
    color: #444;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<div id="flash-overlay"></div>
<canvas id="particles"></canvas>

<div id="title">▲ PENGU/USDT · 實時模擬</div>
<div id="price-display" class="up">$0.008840</div>
<div id="change-display" class="up">+0.00%</div>

<div id="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#00ff88"></div><span style="color:#00ff88">MA7</span></div>
  <div class="legend-item"><div class="legend-dot" style="background:#ff9500"></div><span style="color:#ff9500">MA25</span></div>
  <div class="legend-item"><div class="legend-dot" style="background:#00ccff"></div><span style="color:#00ccff">MA99</span></div>
</div>

<div id="chart-container">
  <canvas id="chart" width="860" height="420"></canvas>
</div>

<div id="volume-bar"></div>

<div id="buttons">
  <button class="btn btn-moon" onclick="triggerMoon()">🚀 暴涨</button>
  <button class="btn btn-crash" onclick="triggerCrash()">💥 崩盘</button>
  <button class="btn btn-reset" onclick="resetChart()">重置</button>
</div>

<div id="status-bar">PENGU/USDT · 1D · 模擬數據</div>

<script>
/* ── Canvas setup ── */
const canvas = document.getElementById('chart');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

/* ── Chart config ── */
const CANDLE_W    = 8;
const CANDLE_GAP  = 2;
const CANDLES_CNT = Math.floor(W / (CANDLE_W + CANDLE_GAP)); // ~78 visible
const PADDING_TOP = 20, PADDING_BOTTOM = 50;
const VOL_H = 0;
const CHART_H = H - PADDING_TOP - PADDING_BOTTOM;
const MID_Y = PADDING_TOP + CHART_H / 2;

/* ── State ── */
let basePrice   = 0.008840;
let candles     = [];
let ma7         = [];
let ma25        = [];
let ma99        = [];
let volumes     = [];
let price       = basePrice;
let sessionHigh = price;
let sessionLow  = price;
let isAnimating = true;
let animId      = null;
let volBars     = [];

/* ── Particle system ── */
const pCanvas = document.getElementById('particles');
const pCtx   = pCanvas.getContext('2d');
let particles = [];
resizeParticles();

window.addEventListener('resize', resizeParticles);

function resizeParticles() {
  pCanvas.width  = window.innerWidth;
  pCanvas.height = window.innerHeight;
}

/* ── Volume bars ── */
const volContainer = document.getElementById('volume-bar');
function buildVolBars() {
  volContainer.innerHTML = '';
  volBars = [];
  for (let i = 0; i < CANDLES_CNT; i++) {
    const div = document.createElement('div');
    div.className = 'vol-bar';
    volContainer.appendChild(div);
    volBars.push(div);
  }
}
buildVolBars();

/* ── Candle generation ── */
function genCandle(close, volatility = 0.012) {
  const open  = close;
  const change = (Math.random() - 0.5) * 2 * volatility;
  const high  = Math.max(open, open * (1 + Math.abs(change) * (1 + Math.random())));
  const low   = Math.min(open, open * (1 - Math.abs(change) * (1 + Math.random() * 0.5)));
  const vol   = Math.random() * 0.8 + 0.2;
  return { open, high, low, close: open * (1 + change), vol };
}

function initCandles() {
  candles = [];
  let p = basePrice;
  for (let i = 0; i < CANDLES_CNT; i++) {
    const c = genCandle(p, 0.008);
    candles.push(c);
    p = c.close;
  }
  price = p;
  calcMA();
  buildVolBars();
  updateVolBars();
}

function calcMA() {
  ma7  = calcMAEx(7);
  ma25 = calcMAEx(25);
  ma99 = calcMAEx(99);
}

function calcMAEx(period) {
  const result = [];
  for (let i = 0; i < candles.length; i++) {
    if (i < period - 1) { result.push(null); continue; }
    let sum = 0;
    for (let j = 0; j < period; j++) sum += candles[i - j].close;
    result.push(sum / period);
  }
  return result;
}

function updateVolBars() {
  const maxVol = Math.max(...volumes.map(v => v)) || 1;
  for (let i = 0; i < volBars.length; i++) {
    const v = volumes[i] || 0;
    const pct = (v / maxVol) * 100;
    volBars[i].style.height = pct + '%';
    const up = candles[i] ? candles[i].close >= candles[i].open : true;
    volBars[i].style.background = up ? '#00ff8866' : '#ff335566';
  }
}

/* ── Price bounds ── */
function getBounds() {
  let lo = Infinity, hi = 0;
  for (const c of candles) { lo = Math.min(lo, c.low); hi = Math.max(hi, c.high); }
  // Include MA lines
  for (const v of [...ma7, ...ma25, ...ma99]) {
    if (v != null) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
  }
  lo = lo * 0.997; hi = hi * 1.003;
  return { lo, hi, range: hi - lo };
}

/* ── Y mapping ── */
function yFor(price, bounds) {
  return PADDING_TOP + CHART_H - ((price - bounds.lo) / bounds.range) * CHART_H;
}

/* ── Draw ── */
function draw() {
  ctx.clearRect(0, 0, W, H);

  // Background subtle grid
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  const gridLines = 6;
  for (let i = 0; i <= gridLines; i++) {
    const y = PADDING_TOP + (CHART_H / gridLines) * i;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  const bounds = getBounds();

  // Draw MA lines
  drawMA(ma7,  '#00ff88', 1.5);
  drawMA(ma25, '#ff9500', 1.5);
  drawMA(ma99, '#00ccff', 1.2);

  // Draw candles
  for (let i = 0; i < candles.length; i++) {
    const c = candles[i];
    const x = i * (CANDLE_W + CANDLE_GAP);
    const up = c.close >= c.open;

    const color   = up ? '#00ff88' : '#ff3355';
    const bodyTop = yFor(Math.max(c.open, c.close), bounds);
    const bodyBot = yFor(Math.min(c.open, c.close), bounds);
    const bodyH   = Math.max(bodyBot - bodyTop, 1);

    // Wick
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x + CANDLE_W / 2, yFor(c.high, bounds));
    ctx.lineTo(x + CANDLE_W / 2, yFor(c.low, bounds));
    ctx.stroke();

    // Body
    ctx.fillStyle = color;
    if (up) {
      ctx.globalAlpha = 0.85;
      ctx.fillRect(x, bodyTop, CANDLE_W, bodyH);
      ctx.globalAlpha = 1;
      // Glow
      ctx.shadowColor = color;
      ctx.shadowBlur  = 4;
      ctx.fillRect(x, bodyTop, CANDLE_W, bodyH);
      ctx.shadowBlur = 0;
    } else {
      ctx.fillRect(x, bodyTop, CANDLE_W, bodyH);
    }

    // Current price dot on right edge
    if (i === candles.length - 1) {
      const dotY = yFor(c.close, bounds);
      ctx.beginPath();
      ctx.arc(W - 6, dotY, 3, 0, Math.PI * 2);
      ctx.fillStyle = up ? '#00ff88' : '#ff3355';
      ctx.shadowColor = up ? '#00ff88' : '#ff3355';
      ctx.shadowBlur = 8;
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  // Price label on right axis
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.font = '10px Courier New';
  ctx.textAlign = 'right';
  for (let i = 0; i <= 4; i++) {
    const priceLabel = bounds.lo + (bounds.range / 4) * i;
    const y = PADDING_TOP + (CHART_H / 4) * i;
    ctx.fillText(priceLabel.toFixed(5), W - 2, y + 3);
  }

  // Update price display
  const last = candles[candles.length - 1];
  const chg  = ((last.close - candles[0].open) / candles[0].open * 100);
  const up   = chg >= 0;
  const pd   = document.getElementById('price-display');
  pd.textContent = '$' + last.close.toFixed(6);
  pd.className   = up ? 'up' : 'down';

  const cd = document.getElementById('change-display');
  cd.textContent = (up ? '+' : '') + chg.toFixed(2) + '%';
  cd.className   = up ? 'up' : 'down';
}

function drawMA(data, color, width) {
  ctx.strokeStyle = color;
  ctx.lineWidth   = width;
  ctx.beginPath();
  let started = false;
  for (let i = 0; i < data.length; i++) {
    if (data[i] == null) continue;
    const x = i * (CANDLE_W + CANDLE_GAP) + CANDLE_W / 2;
    const bounds = getBounds();
    const y = yFor(data[i], bounds);
    if (!started) { ctx.moveTo(x, y); started = true; }
    else ctx.lineTo(x, y);
  }
  ctx.stroke();
}

/* ── Auto animation ── */
let lastTick = 0;
const TICK_MS = 180;

function tick(timestamp) {
  if (!isAnimating) { animId = requestAnimationFrame(tick); return; }
  if (timestamp - lastTick > TICK_MS) {
    lastTick = timestamp;
    scrollAndAdd();
    draw();
  }
  animId = requestAnimationFrame(tick);
}

function scrollAndAdd() {
  candles.shift();
  const last = candles[candles.length - 1];
  const momentum = (last.close - price) / price;

  // Random walk with slight mean reversion
  const volatility = 0.006 + Math.abs(momentum) * 0.015;
  const drift = (Math.random() - 0.48) * volatility;
  price = last.close * (1 + drift);
  price = Math.max(price, last.close * 0.97);
  price = Math.min(price, last.close * 1.03);

  const c = genCandle(last.close, volatility * 0.5);
  c.close = price;
  candles.push(c);

  sessionHigh = Math.max(sessionHigh, price);
  sessionLow  = Math.min(sessionLow,  price);

  // Volume
  volumes.shift();
  volumes.push(c.vol);
  updateVolBars();

  calcMA();
}

/* ── Event handlers ── */
function triggerMoon() {
  flash('moon');
  spawnParticles('moon');

  // Aggressive upward moves
  let count = 0;
  const interval = setInterval(() => {
    const last = candles[candles.length - 1];
    const surge = (Math.random() * 0.04) + 0.02;
    price = last.close * (1 + surge);
    const c = genCandle(last.close, surge * 0.6);
    c.close = Math.min(price, sessionHigh * 1.25);
    candles.push(c);
    candles.shift();
    volumes.shift(); volumes.push(c.vol);

    // Extra vol spike on moon moves
    volumes[volumes.length - 1] = Math.min(1.5, c.vol * (2 + Math.random()));

    price = c.close;
    sessionHigh = Math.max(sessionHigh, price);
    calcMA();
    draw();
    updateVolBars();

    count++;
    if (count >= 20) {
      clearInterval(interval);
      // Extra particle burst
      for (let i = 0; i < 3; i++) setTimeout(() => spawnParticles('moon'), i * 300);
    }
  }, 120);
}

function triggerCrash() {
  flash('crash');
  document.body.classList.add('shaking');
  setTimeout(() => document.body.classList.remove('shaking'), 800);
  spawnParticles('crash');

  let count = 0;
  const interval = setInterval(() => {
    const last = candles[candles.length - 1];
    const drop = -(Math.random() * 0.045 + 0.015);
    price = last.close * (1 + drop);
    const c = genCandle(last.close, Math.abs(drop) * 0.6);
    c.close = Math.max(price, sessionLow * 0.75);
    candles.push(c);
    candles.shift();
    volumes.shift(); volumes.push(c.vol * 1.5);
    price = c.close;
    sessionLow = Math.min(sessionLow, price);
    calcMA();
    draw();
    updateVolBars();

    count++;
    if (count >= 20) {
      clearInterval(interval);
      document.body.classList.add('shaking');
      setTimeout(() => document.body.classList.remove('shaking'), 700);
      for (let i = 0; i < 3; i++) setTimeout(() => spawnParticles('crash'), i * 300);
    }
  }, 120);
}

function resetChart() {
  flash('moon');
  basePrice = 0.008840;
  price     = basePrice;
  sessionHigh = price;
  sessionLow  = price;
  candles = [];
  volumes = [];
  initCandles();
  draw();
}

function flash(type) {
  const overlay = document.getElementById('flash-overlay');
  overlay.className = type;
  // Force reflow to restart animation
  void overlay.offsetWidth;
  overlay.className = type;
}

/* ── Particles ── */
function spawnParticles(type) {
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;
  const count = type === 'moon' ? 80 : 120;

  for (let i = 0; i < count; i++) {
    const angle = (Math.random() * Math.PI * 2);
    const speed = Math.random() * (type === 'moon' ? 8 : 12) + 2;
    const size = Math.random() * 4 + 1;
    const color = type === 'moon'
      ? `hsl(${40 + Math.random()*30}, 100%, ${50+Math.random()*30}%)`
      : `hsl(${Math.random()*20}, 100%, ${40+Math.random()*20}%)`;

    particles.push({
      x: cx, y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - (type === 'moon' ? 3 : 1),
      size,
      color,
      life: 1.0,
      decay: 0.012 + Math.random() * 0.015
    });
  }
}

function updateParticles() {
  pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x  += p.vx;
    p.y  += p.vy;
    p.vy += 0.15; // gravity
    p.vx *= 0.99;
    p.life -= p.decay;

    if (p.life <= 0) { particles.splice(i, 1); continue; }

    pCtx.globalAlpha = p.life;
    pCtx.fillStyle   = p.color;
    pCtx.beginPath();
    pCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    pCtx.fill();
  }
  pCtx.globalAlpha = 1;
  requestAnimationFrame(updateParticles);
}

/* ── Init ── */
initCandles();
calcMA();
draw();
animId = requestAnimationFrame(tick);
requestAnimationFrame(updateParticles);

// Touch support for mobile
document.addEventListener('touchstart', () => {}, { passive: true });
</script>
</body>
</html>
